name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile copies a pre-built frontend/dist into the runtime
      # stage, so build it here first.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install frontend deps
        working-directory: frontend
        run: bun install --frozen-lockfile
      - name: Build frontend
        working-directory: frontend
        run: bun run build

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The supervisor pulls `<image>:<version>` where image is the
      # config.json `image` field with `{arch}` substituted and version is the
      # config.json `version`. Tag accordingly so the store can find it.
      - name: Read addon version
        id: ver
        run: |
          v=$(node -e "console.log(require('./config.json').version)")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/outl-homeassistant-addon-amd64:${{ steps.ver.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/outl-homeassistant-addon-amd64:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
